# ── Prompt layout ──────────────────────────────────────────────
format = """
[](fg:#2d353b)\
$os\
$username\
[](bg:#343f44 fg:#2d353b)\
$directory\
[](fg:#343f44 bg:#3d484d)\
$git_branch\
$git_status\
[](fg:#3d484d bg:#2d353b)\
$nodejs\
$python\
$rust\
$golang\
$java\
$docker_context\
[](fg:#2d353b)\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

[fill]
symbol = " "

[os]
disabled = false
style = "bg:#2d353b fg:#d699b6"

[os.symbols]
Alpine = " "
Android = " "
Arch = "󰌽 "
Artix = " "
CachyOS = "󰌽 "
CentOS = " "
Debian = "󰌚 "
EndeavourOS = " "
Fedora = "󰌛 "
FreeBSD = " "
Gentoo = "󰌨 "
Linux = " "
Macos = " "
Manjaro = " "
Mint = "󰌭 "
NixOS = " "
openSUSE = " "
Pop = " "
Ubuntu = " "
Unknown = "󰌶 "

[username]
show_always  = true
style_user   = "bg:#2d353b fg:#7fbbb3 bold"
style_root   = "bg:#2d353b fg:#e67e80 bold"
format       = '[ $user ]($style)'

[directory]
style            = "bg:#343f44 fg:#dbbc7f bold"
format           = "[ 󰉋 $path ]($style)"
truncation_length = 3
truncate_to_repo = true
read_only        = " 󰌾"
read_only_style  = "bg:#343f44 fg:#e67e80"

[git_branch]
style  = "bg:#3d484d fg:#a7c080 bold"
format = '[[ $symbol $branch ]($style)]'
symbol = "󰊢 "

[git_status]
style     = "bg:#3d484d fg:#e69875"
format    = '([$all_status$ahead_behind ]($style))'
conflicted = "󱞇 "
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
untracked  = "? "
stashed    = "󰿢 "
modified   = "! "
staged     = "+ "
deleted    = "✘ "

[nodejs]
style   = "bg:#2d353b fg:#a7c080"
format  = '[ $symbol($version) ]($style)'
symbol  = " "

[python]
style   = "bg:#2d353b fg:#dbbc7f"
format  = '[ $symbol($version) ]($style)'
symbol  = " "

[rust]
style  = "bg:#2d353b fg:#e69875"
format = '[ $symbol($version) ]($style)'
symbol = " "

[golang]
style  = "bg:#2d353b fg:#7fbbb3"
format = '[ $symbol($version) ]($style)'
symbol = " "

[java]
style  = "bg:#2d353b fg:#e67e80"
format = '[ $symbol($version) ]($style)'
symbol = " "

[docker_context]
style  = "bg:#2d353b fg:#83c092"
format = '[ $symbol$context ]($style)'
symbol = "󰡨 "

[cmd_duration]
min_time = 2_000
style    = "fg:#e69875"
format   = '[$symbol$duration]($style) '
symbol   = "󰔚 "

[time]
disabled    = false
time_format = "%R"
style       = "fg:#859289"
format      = '[$time]($style)'

[character]
success_symbol = "[❯](bold #a7c080)"
error_symbol   = "[❯](bold #e67e80)"
