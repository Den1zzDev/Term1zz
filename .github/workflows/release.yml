name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o term1zz ./cmd/term1zz
          tar -czf "term1zz-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" term1zz

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: term1zz-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
